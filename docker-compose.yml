services:
  redis:
    image: redis:8.8.0-alpine
    container_name: brain_cache_redis
    environment:
      - name=value
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: brain_cache_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:dev
    container_name: brain_cache_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  qdrant_storage: